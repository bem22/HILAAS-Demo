agent_id: hilaas-pi2-c3
server_address: http://127.0.0.1:15000
logging_level: INFO
polling_interval: 10
job_queues: [hilaas-esp32c3-pi2]
advertised_queues:
  hilaas-esp32c3-pi2: "Pi 2 ESP32-C3; non-flashing smoke only, firmware execution disabled"
execution_basedir: /home/ubuntu/hilaas/pi2-c3/run
results_basedir: /home/ubuntu/hilaas/pi2-c3/results
logging_basedir: /home/ubuntu/hilaas/pi2-c3/logs
provision_type: noprovision
setup_command: /usr/bin/env PYTHONPATH=/srv/agent-configs /srv/testflinger-venv/bin/python /srv/agent-configs/hilaas/pi_smoke.py --agent hilaas-pi2-c3 --validate-only
provision_command: /bin/true
test_command: /usr/bin/env PYTHONPATH=/srv/agent-configs /srv/testflinger-venv/bin/python /srv/agent-configs/hilaas/pi_smoke.py --agent hilaas-pi2-c3
cleanup_command: /bin/true