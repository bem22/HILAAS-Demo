agent_id: hilaas-pi2-c3
server_address: http://127.0.0.1:15000
logging_level: INFO
polling_interval: 10
job_queues: [hilaas-esp32c3-pi2]
advertised_queues:
  hilaas-esp32c3-pi2: "Pi 2 ESP32-C3; registered only, firmware execution disabled"
execution_basedir: /home/ubuntu/hilaas/pi2-c3/run
results_basedir: /home/ubuntu/hilaas/pi2-c3/results
logging_basedir: /home/ubuntu/hilaas/pi2-c3/logs
provision_type: noprovision
setup_command: /bin/false
provision_command: /bin/false
test_command: /bin/false
cleanup_command: /bin/true