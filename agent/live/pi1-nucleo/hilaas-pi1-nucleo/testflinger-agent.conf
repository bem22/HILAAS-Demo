agent_id: hilaas-pi1-nucleo
server_address: http://127.0.0.1:15000
logging_level: INFO
polling_interval: 10
job_queues: [hilaas-nucleo-pi1]
advertised_queues:
  hilaas-nucleo-pi1: "Pi 1 NUCLEO-H753ZI; non-flashing smoke only, firmware execution disabled"
execution_basedir: /home/ubuntu/hilaas/pi1-nucleo/run
results_basedir: /home/ubuntu/hilaas/pi1-nucleo/results
logging_basedir: /home/ubuntu/hilaas/pi1-nucleo/logs
provision_type: noprovision
setup_command: /usr/bin/env PYTHONPATH=/srv/agent-configs /srv/testflinger-venv/bin/python /srv/agent-configs/hilaas/pi_smoke.py --agent hilaas-pi1-nucleo --validate-only
provision_command: /bin/true
test_command: /usr/bin/env PYTHONPATH=/srv/agent-configs /srv/testflinger-venv/bin/python /srv/agent-configs/hilaas/pi_smoke.py --agent hilaas-pi1-nucleo
cleanup_command: /bin/true