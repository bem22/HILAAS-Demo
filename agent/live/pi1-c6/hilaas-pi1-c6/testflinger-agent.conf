agent_id: hilaas-pi1-c6
server_address: http://127.0.0.1:15000
logging_level: INFO
polling_interval: 10
job_queues: [hilaas-esp32c6-pi1]
advertised_queues:
  hilaas-esp32c6-pi1: "ESP32-C6 on Pi 1; approved CRC32 and uint32-wrap firmware demo"
execution_basedir: /home/ubuntu/hilaas/pi1-c6/run
results_basedir: /home/ubuntu/hilaas/pi1-c6/results
logging_basedir: /home/ubuntu/hilaas/pi1-c6/logs
provision_type: noprovision
setup_command: /usr/bin/env HILAAS_DEVICE_CONFIG=/etc/hilaas/esp32c6.json /opt/hilaas-demo/.venv/bin/python -I -m hilaas.device
provision_command: /bin/true
test_command: /bin/bash /opt/hilaas-demo/agent/run-c6.sh
cleanup_command: /bin/true