agent_id: hilaas-pi1-c6
server_address: http://127.0.0.1:15000
logging_level: INFO
polling_interval: 10
job_queues: [hilaas-esp32c6-pi1]
advertised_queues:
  hilaas-esp32c6-pi1: "Pi 1 ESP32-C6; non-flashing smoke only, firmware execution disabled"
execution_basedir: /home/ubuntu/hilaas/pi1-c6/run
results_basedir: /home/ubuntu/hilaas/pi1-c6/results
logging_basedir: /home/ubuntu/hilaas/pi1-c6/logs
provision_type: noprovision
setup_command: /usr/bin/env PYTHONPATH=/srv/agent-configs /srv/testflinger-venv/bin/python /srv/agent-configs/hilaas/pi_smoke.py --agent hilaas-pi1-c6 --validate-only
provision_command: /bin/true
test_command: /usr/bin/env PYTHONPATH=/srv/agent-configs /srv/testflinger-venv/bin/python /srv/agent-configs/hilaas/pi_smoke.py --agent hilaas-pi1-c6
cleanup_command: /bin/true