agent_id: hilaas-pi1-microbit
server_address: http://127.0.0.1:15000
logging_level: INFO
polling_interval: 10
job_queues: [hilaas-microbit-pi1]
advertised_queues:
  hilaas-microbit-pi1: "Pi 1 micro:bit V2; non-flashing smoke only, firmware execution disabled"
execution_basedir: /home/ubuntu/hilaas/pi1-microbit/run
results_basedir: /home/ubuntu/hilaas/pi1-microbit/results
logging_basedir: /home/ubuntu/hilaas/pi1-microbit/logs
provision_type: noprovision
setup_command: /usr/bin/env PYTHONPATH=/srv/agent-configs /srv/testflinger-venv/bin/python /srv/agent-configs/hilaas/pi_smoke.py --agent hilaas-pi1-microbit --validate-only
provision_command: /bin/true
test_command: /usr/bin/env PYTHONPATH=/srv/agent-configs /srv/testflinger-venv/bin/python /srv/agent-configs/hilaas/pi_smoke.py --agent hilaas-pi1-microbit
cleanup_command: /bin/true