apiVersion: v1
kind: Service
metadata:
  name: hilaas-testflinger-api
  namespace: testflinger
spec:
  selector:
    app.kubernetes.io/name: testflinger-k8s
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hilaas-browser
  namespace: testflinger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hilaas-browser
  template:
    metadata:
      labels:
        app: hilaas-browser
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.0
          args:
            - --provider=github
            - --github-user=bem22
            - --github-user=aleccondry
            - --github-user=locnnil
            - --github-user=pedroishimaru
            - --github-user=fderepas
            - --email-domain=*
            - --http-address=0.0.0.0:4180
            - --upstream=http://hilaas-testflinger-api.testflinger.svc.cluster.local:5000
            - --redirect-url=https://testflinger.16-16-193-47.sslip.io/oauth2/callback
            - --reverse-proxy=true
            - --skip-provider-button=true
            - --cookie-name=__Host-hilaas_users_v2
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
            - --cookie-expire=8h
            - --cookie-refresh=1h
            - --pass-access-token=false
            - --pass-authorization-header=false
            - --pass-basic-auth=false
            - --request-logging=false
            - --auth-logging=false
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hilaas-browser-oauth
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hilaas-browser-oauth
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: hilaas-browser-oauth
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: hilaas-browser
  namespace: testflinger
spec:
  selector:
    app: hilaas-browser
  ports:
    - name: http
      port: 4180
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hilaas-browser
  namespace: testflinger
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/enable-access-log: 'false'
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
spec:
  ingressClassName: public
  tls:
    - hosts:
        - testflinger.16-16-193-47.sslip.io
      secretName: hilaas-browser-tls
  rules:
    - host: testflinger.16-16-193-47.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hilaas-browser
                port:
                  number: 4180