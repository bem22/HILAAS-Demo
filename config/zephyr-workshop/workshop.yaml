name: hilaas-zephyr-tools
base: ubuntu@26.04
sdks:
  - name: uv
    channel: latest/stable
  - name: zephyr
    channel: 26.04/stable
  - name: zephyr-sdk-ng
    channel: 1.0.1/stable
  - name: zephyr-arm
    channel: 1.0.1/stable
connections:
  - plug: zephyr:sdk-ng
    slot: zephyr-sdk-ng:sdk-ng
  - plug: zephyr-sdk-ng:arm
    slot: zephyr-arm:toolchain
  - plug: zephyr:venv
    slot: uv:venv
actions:
  build: |-
    set -eu
    : "${HILAAS_BOARD:?}" "${HILAAS_COMMIT:?}" "${HILAAS_RUN_ID:?}" "${HILAAS_NONCE:?}"
    west --version
    "$ZEPHYR_SDK_INSTALL_DIR/arm-zephyr-eabi/bin/arm-zephyr-eabi-gcc" --version
    west build -p always -b "$HILAAS_BOARD" /project/firmware/zephyr -d /project/build/zephyr -- \
      -DHILAAS_COMMIT="$HILAAS_COMMIT" -DHILAAS_RUN_ID="$HILAAS_RUN_ID" \
      -DHILAAS_NONCE="$HILAAS_NONCE" -DHILAAS_BOARD="$HILAAS_BOARD"
  check-tools: |-
    set -eu
    west --version
    "$ZEPHYR_SDK_INSTALL_DIR/arm-zephyr-eabi/bin/arm-zephyr-eabi-gcc" --version
    west boards | grep '^bbc_microbit'